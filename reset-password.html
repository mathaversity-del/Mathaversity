<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — Sabaq Math</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lib/auth-theme.css">
</head>
<body>

<div class="sabaq-topbar">
  <a class="sabaq-brand" href="/index.html">
    <span class="badge">M</span> Sabaq
  </a>
</div>

<div class="sabaq-auth-wrap">
  <div class="sabaq-auth-card">
    <h1>Set a new password</h1>
    <p class="sub" id="subText">Choose a new password for your account.</p>

    <form id="resetForm">
      <div class="sabaq-field">
        <label for="password">New password</label>
        <input type="password" id="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="sabaq-field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required>
      </div>
      <button type="submit" class="sabaq-btn" id="resetBtn">Update password</button>
      <div class="sabaq-status" id="statusEl"></div>
    </form>

    <p class="sabaq-alt-link"><a href="/login.html">Back to log in</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/lib/supabaseClient.js"></script>
<script>
function showStatus(msg, type){
  const el = document.getElementById('statusEl');
  el.textContent = msg;
  el.className = 'sabaq-status show ' + type;
}

sabaqSupabase.auth.onAuthStateChange((event) => {
  if(event === 'PASSWORD_RECOVERY'){
    document.getElementById('subText').textContent = 'Recovery link verified — choose a new password.';
  }
});

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const btn = document.getElementById('resetBtn');

  if(password !== confirmPassword){
    showStatus('Passwords do not match.', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Updating...';

  const { error } = await sabaqSupabase.auth.updateUser({ password });

  if(error){
    showStatus(error.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Update password';
    return;
  }

  showStatus('Password updated — you can log in now.', 'success');
  setTimeout(() => { window.location.href = '/login.html'; }, 1500);
});
</script>
</body>
</html>
