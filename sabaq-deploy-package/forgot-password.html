<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Sabaq Math</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lib/auth-theme.css">
</head>
<body>

<div class="sabaq-topbar">
  <a class="sabaq-brand" href="/index.html">
    <span class="badge">M</span> Sabaq
  </a>
</div>

<div class="sabaq-auth-wrap">
  <div class="sabaq-auth-card">
    <h1>Forgot your password?</h1>
    <p class="sub">Enter your email and we'll send you a reset link.</p>

    <form id="forgotForm">
      <div class="sabaq-field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <button type="submit" class="sabaq-btn" id="sendBtn">Send reset link</button>
      <div class="sabaq-status" id="statusEl"></div>
    </form>

    <p class="sabaq-alt-link"><a href="/login.html">Back to log in</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/lib/supabaseClient.js"></script>
<script>
function showStatus(msg, type){
  const el = document.getElementById('statusEl');
  el.textContent = msg;
  el.className = 'sabaq-status show ' + type;
}

document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = 'Sending...';

  const { error } = await sabaqSupabase.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/reset-password.html'
  });

  if(error){
    showStatus(error.message, 'error');
  } else {
    showStatus('If an account exists for that email, a reset link is on its way.', 'success');
  }
  btn.disabled = false;
  btn.textContent = 'Send reset link';
});
</script>
</body>
</html>
